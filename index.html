<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>神秘联络方式 · SECRET CONTACT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f3f1;color:#202020;font:15px/1.6 system-ui,-apple-system,'Microsoft YaHei',sans-serif}.page{max-width:1080px;margin:auto;padding:28px 18px 60px}header{border-bottom:1px solid #ccc;padding-bottom:18px;margin-bottom:26px}h1{font-size:clamp(26px,4vw,42px);font-weight:500;margin:0;letter-spacing:.04em}header p{color:#666;margin:4px 0}.columns{display:grid;grid-template-columns:minmax(270px,360px) minmax(0,1fr);gap:22px}.panel{background:white;border:1px solid #ddd;border-radius:10px;padding:22px}.panel h2{font-size:16px;margin:0 0 16px;font-weight:600}label.field{display:block;margin:15px 0 6px;font-size:13px;color:#555}input,textarea,select{width:100%;border:1px solid #bbb;border-radius:6px;background:white;color:#222;padding:10px 12px;font:inherit}textarea{min-height:72px;resize:vertical}input[type=file]{font-size:12px}input:focus,textarea:focus,select:focus{outline:1px solid #333}.row{display:flex;align-items:center;gap:9px}.row>*{flex:1}.buttons{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}button{border:1px solid #333;padding:10px 14px;border-radius:6px;background:#fff;color:#222;cursor:pointer;font:inherit}button.primary{background:#222;color:white}button:hover{opacity:.8}.hint,.small{font-size:12px;color:#666}.hint{margin:8px 0}#stage{background:conic-gradient(#ececec 25%, #fafafa 0 50%, #ececec 0 75%, #fafafa 0) 0 0 / 20px 20px;border:1px solid #ddd;border-radius:7px;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:14px}canvas{display:block;width:100%;max-width:480px;height:auto;box-shadow:0 4px 17px #0001}#studio{margin-top:22px}.assetGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.assetGrid label{text-align:center;font-size:12px;border:1px solid #ddd;border-radius:6px;padding:8px 4px;min-width:0}.assetGrid input{padding:0;font-size:10px;max-width:100%}.line{height:1px;background:#ddd;margin:20px 0}#toast{color:#555;font-size:13px;margin-top:10px}select{min-width:0}#presetWrap{margin-top:10px}@media(max-width:780px){.columns{grid-template-columns:1fr}.page{padding:18px 12px}.panel{padding:17px}}
</style></head><body>
<div class="page"><header><h1>神秘联络方式 <span style="font-size:.35em;white-space:nowrap;letter-spacing:.12em">SECRET CONTACT</span></h1><p>把你的联络暗号藏进一张可以分享的透明卡片。</p></header>
<div class="columns"><section class="panel"><h2>制作你的联络卡</h2>
<label class="field" for="code">联系方式 / 暗号（最多 12 字符）</label><input id="code" value="09012345678" maxlength="12" autocomplete="off" spellcheck="false"><p class="hint">支持数字、大小写字母及 . / _ @；9 位→3+3+3，11 位→4+4+3，12 位→4+4+4</p>
<label class="field" for="headline">卡片标题</label><input id="headline" maxlength="24" value="秘密联络卡">
<label class="field" for="dialog">对话框文字</label><textarea id="dialog" maxlength="80">解开以下谜题，获取我的神秘联络方式。</textarea>
<label class="field">画面比例</label><select id="ratio"><option value="4:5">4:5 竖版（推荐）</option><option value="1:1">1:1 正方形</option></select>
<label class="field">人物主体</label><select id="portraitMode"><option value="preset">从预设人物中选</option><option value="upload">上传自己的透明人物 PNG</option><option value="none">不显示人物</option></select>
<div id="presetWrap"><label class="field" for="preset">预设人物</label><select id="preset"></select></div><div id="portraitUpload" style="display:none"><label class="field">上传人物（仅在本机处理）</label><input id="portraitFile" type="file" accept="image/png,image/webp,image/jpeg"></div>
<div class="buttons"><button class="primary" id="make">生成预览</button><button id="save">保存透明 PNG</button></div><div id="toast" aria-live="polite"></div></section>
<section class="panel"><h2>生成预览</h2><div id="stage"><canvas id="card" width="1200" height="1500"></canvas></div><p class="small">棋盘格只是用于显示透明区域，导出图片不含棋盘格。手机号或联络方式不会上传服务器。</p></section></div>

</div>
<script>
const STUDIO_MODE = false;
const BUILT_IN = {"digits": {}, "portraits": {}};
const $=id=>document.getElementById(id);
const digitImages = {...(BUILT_IN.digits||{})};
const portraitImages = {...(BUILT_IN.portraits||{})};
let uploadedPortrait = null;
const cache = new Map();
function getImage(src){if(!src)return Promise.resolve(null);if(cache.has(src))return cache.get(src);const promise=new Promise(resolve=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>resolve(null);im.src=src;});cache.set(src,promise);return promise;}
function formatCode(value){return [...value].filter(ch=>/[0-9A-Za-z./_@]/.test(ch)).slice(0,12).join('');}
function chunkSizes(n){if(n===9)return[3,3,3];if(n===11)return[4,4,3];if(n===12)return[4,4,4];if(n<=4)return[n];const rows=Math.ceil(n/4),base=Math.floor(n/rows),extra=n%rows;return Array.from({length:rows},(_,i)=>base+(i<extra?1:0));}
function rounded(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function wrapText(ctx,text,maxWidth){const lines=[];for(const paragraph of String(text).split('\n')){let cur='';for(const ch of [...paragraph]){if(ctx.measureText(cur+ch).width>maxWidth&&cur){lines.push(cur);cur=ch;}else cur+=ch;}lines.push(cur);}return lines;}
function placeholderPortrait(ctx,id,x,y,w,h){const gray=['#d7d7d7','#c8c8c8','#e0e0e0','#bfbfbf','#d3d3d3'][id%5];ctx.save();ctx.fillStyle=gray;ctx.beginPath();ctx.ellipse(x+w*.5,y+h*.36,w*.25,h*.23,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(x+w*.5,y+h*1.04,w*.47,h*.44,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#888';ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillText(String(id+1).padStart(2,'0'),x+w*.5,y+h*.90);ctx.restore();}
function drawFit(ctx,im,x,y,w,h){const scale=Math.min(w/im.width,h/im.height);const iw=im.width*scale,ih=im.height*scale;ctx.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih);}
async function render(){const canvas=$('card'),ctx=canvas.getContext('2d');const square=$('ratio').value==='1:1';canvas.width=1200;canvas.height=square?1200:1500;const W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);ctx.fillStyle='#161616';ctx.textBaseline='middle';ctx.textAlign='left';ctx.font='32px system-ui';ctx.fillText('SECRET CONTACT  /  PRIVATE MESSAGE',74,75);ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(74,111);ctx.lineTo(W-74,111);ctx.stroke();
const title=$('headline').value||'秘密联络卡';ctx.font='600 51px system-ui';ctx.fillText(title.slice(0,24),74,177);
const top=233,topH=square?330:390;let px=74,pw=310,py=top+10,ph=topH-25;const portraitMode=$('portraitMode').value; if(portraitMode!=='none'){let im=null;if(portraitMode==='upload'){im=await getImage(uploadedPortrait);}else{im=await getImage(portraitImages[$('preset').value]);}if(im)drawFit(ctx,im,px,py,pw,ph);else placeholderPortrait(ctx,Number($('preset').value)||0,px,py,pw,ph);}
const tx=portraitMode==='none'?74:424;const tw=W-tx-74;rounded(ctx,tx,top+8,tw,topH-18,26);ctx.strokeStyle='#222';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#161616';ctx.font='38px system-ui';const lines=wrapText(ctx,$('dialog').value||'请在这里找到我。',tw-60);const maxLines=Math.min(lines.length,5);let fs=38;if(lines.length>4)fs=31;ctx.font=fs+'px system-ui';lines.slice(0,maxLines).forEach((line,i)=>ctx.fillText(line,tx+30,top+80+i*(fs+14)));ctx.font='22px system-ui';ctx.fillStyle='#888';ctx.fillText('TO: YOU',tx+30,top+topH-65);
const code=formatCode($('code').value);if($('code').value!==code)$('code').value=code;let startY=top+topH+50;ctx.fillStyle='#555';ctx.font='25px system-ui';ctx.fillText('DECODE THE FOLLOWING',74,startY);
const sizes=chunkSizes(code.length);const availH=H-startY-105,rows=sizes.length;const gapY=square?12:22;const cellH=Math.min(square?132:175,(availH-gapY*Math.max(0,rows-1))/Math.max(rows,1));const cellW=Math.min(193,cellH*.87);const gapX=14;let pos=0;for(let ri=0;ri<rows;ri++){const count=sizes[ri],width=count*cellW+(count-1)*gapX;let xx=(W-width)/2, yy=startY+45+ri*(cellH+gapY);for(let j=0;j<count;j++){const ch=code[pos++];const asset=/^[0-9]$/.test(ch)?digitImages[ch]:null;const im=await getImage(asset);if(im){drawFit(ctx,im,xx,yy,cellW,cellH);}else{ctx.fillStyle='#171717';ctx.textAlign='center';ctx.font=`500 ${Math.round(Math.min(cellH*.63,102))}px system-ui`;ctx.fillText(ch,xx+cellW/2,yy+cellH/2);ctx.textAlign='left';}xx+=cellW+gapX;}}if(!code){ctx.fillStyle='#aaa';ctx.font='32px system-ui';ctx.fillText('在左侧输入你的暗号',74,startY+125);} $('toast').textContent=code?`已生成 ${code.length} 位 · ${sizes.join(' + ')} 排版`:'请输入 1–12 位字符';}
async function save(){await render();const a=document.createElement('a');a.download='神秘联络方式.png';a.href=$('card').toDataURL('image/png');a.click();}
function updateMode(){const m=$('portraitMode').value;$('presetWrap').style.display=m==='preset'?'':'none';$('portraitUpload').style.display=m==='upload'?'':'none';render();}
for(let i=0;i<10;i++){const o=document.createElement('option');o.value=i;o.textContent=`角色 ${String(i+1).padStart(2,'0')}`;$('preset').appendChild(o);}
$('portraitFile').addEventListener('change',async e=>{const f=e.target.files[0];if(f){uploadedPortrait=await readFile(f);render();}});
$('portraitMode').addEventListener('change',updateMode);
for(const id of ['code','headline','dialog','ratio','preset'])$(id).addEventListener('input',()=>render());
$('make').addEventListener('click',()=>render());$('save').addEventListener('click',save);
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});}

render();
</script></body></html>
